# YOLOv11 + WTB-DefectNet backbone, v2: adds a P2 (stride 4) detection
# head on top of the original 3-scale (P3/P4/P5) design.
#
# WHY: testing on WTBs2025 showed a hard, mechanistic failure mode --
# classes with sub-3-pixel-wide boxes (pinholes, coating detachment,
# erosion, localized damage, paint cracks, surface stains) scored near
# 0% mAP in BOTH this backbone and stock YOLOv11n, while large-box
# classes (oil leakage, lightning strikes) scored ~98%. Standard YOLO's
# finest stride is 8 (an 8x8 pixel patch per cell) -- a 2-3px object is
# smaller than the detector can represent at all, regardless of
# backbone. This is architecture-blind: it affected both models
# identically, which is what pointed to the detection head's
# resolution, not the backbone, as the bottleneck.
#
# THE FIX: WTBStage1 already produces a stride-4 (P2-level) feature map
# natively -- it just wasn't being routed anywhere before. This version
# feeds it into an extended 4-scale neck/head (P2/P3/P4/P5), the same
# fix HDS-YOLO's paper used for the identical problem on a different
# WTB dataset. No new backbone modules needed -- WTBStage1's output was
# already there, just unused.
#
# Channel/stride map (unchanged backbone, same as v1):
#   Stage1 out = 64ch  @ stride 4  -> P2 (NEW: tiny defects -- pinholes, hairline cracks)
#   Stage2 out = 128ch @ stride 8  -> P3 (small objects)
#   Stage3 out = 256ch @ stride 16 -> P4 (medium objects)
#   Stage4 out = 512ch @ stride 32 -> P5 (large objects -- erosion patches, oil leakage stains)

nc: 9

scales:
  n: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, WTBStem,   [64]]    # 0  P1/4   (DSPS)
  - [-1, 1, WTBStage1, [64]]    # 1  P2/4   (TSDB+ASA, no downsample) <- now used by neck
  - [-1, 1, WTBStage2, [128]]   # 2  P3/8   (TSDB+ASA+DRFB)
  - [-1, 1, WTBStage3, [256]]   # 3  P4/16  (TSDB+ASA+WGFR)
  - [-1, 1, WTBStage4, [512]]   # 4  P5/32  (TSDB+ASA+MSCA)
  - [-1, 1, SPPF, [512, 5]]     # 5  P5/32  (standard receptive-field pool)

head:
  # ---- top-down path (P5 -> P4 -> P3 -> P2), coarse-to-fine fusion ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 6
  - [[-1, 3], 1, Concat, [1]]                         # 7  cat backbone P4 (layer 3)
  - [-1, 2, C3k2, [256, False]]                       # 8  P4-td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 9
  - [[-1, 2], 1, Concat, [1]]                         # 10 cat backbone P3 (layer 2)
  - [-1, 2, C3k2, [128, False]]                       # 11 P3-td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 12
  - [[-1, 1], 1, Concat, [1]]                         # 13 cat backbone P2 (layer 1, native /4 -- NEW)
  - [-1, 2, C3k2, [64, False]]                        # 14 P2-final (tiny objects) <- Detect input

  # ---- bottom-up path (P2 -> P3 -> P4 -> P5), refine with fine-grained detail ----
  - [-1, 1, Conv, [64, 3, 2]]                         # 15
  - [[-1, 11], 1, Concat, [1]]                        # 16 cat P3-td (layer 11)
  - [-1, 2, C3k2, [128, False]]                       # 17 P3-final (small objects) <- Detect input

  - [-1, 1, Conv, [128, 3, 2]]                        # 18
  - [[-1, 8], 1, Concat, [1]]                         # 19 cat P4-td (layer 8)
  - [-1, 2, C3k2, [256, False]]                       # 20 P4-final (medium objects) <- Detect input

  - [-1, 1, Conv, [256, 3, 2]]                        # 21
  - [[-1, 5], 1, Concat, [1]]                         # 22 cat backbone P5/SPPF (layer 5)
  - [-1, 2, C3k2, [512, True]]                        # 23 P5-final (large objects) <- Detect input

  - [[14, 17, 20, 23], 1, Detect, [nc]]               # 24 Detect(P2, P3, P4, P5)
