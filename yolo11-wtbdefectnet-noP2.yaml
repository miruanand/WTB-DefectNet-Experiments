# YOLOv11 + WTB-DefectNet backbone -- ORIGINAL 3-scale (P3/P4/P5) version,
# WITHOUT the P2 head. Kept alongside yolo11-wtbdefectnet.yaml (the P2
# version) specifically so you can run a controlled ablation: train both
# with identical --data/--epochs/--batch/--imgsz/--scale/--mosaic and
# compare per-class mAP, especially on the tiny-object classes (pinholes,
# coating detachment, paint cracks, localized damage, surface stains,
# erosion) where the P2 head should matter most. If the P2 version doesn't
# meaningfully beat this one on those classes, the P2 head isn't the
# bottleneck and the fix is elsewhere (imgsz, tiling, class imbalance).
#
# Use via: python train_yolo.py --arch no_p2 ...

nc: 9

scales:
  n: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, WTBStem,   [64]]    # 0  P1/4   (DSPS)
  - [-1, 1, WTBStage1, [64]]    # 1  P1/4   (TSDB+ASA, no downsample)
  - [-1, 1, WTBStage2, [128]]   # 2  P3/8   (TSDB+ASA+DRFB)
  - [-1, 1, WTBStage3, [256]]   # 3  P4/16  (TSDB+ASA+WGFR)
  - [-1, 1, WTBStage4, [512]]   # 4  P5/32  (TSDB+ASA+MSCA)
  - [-1, 1, SPPF, [512, 5]]     # 5  P5/32  (standard receptive-field pool)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 6
  - [[-1, 3], 1, Concat, [1]]                        # 7  cat backbone P4 (layer 3)
  - [-1, 2, C3k2, [256, False]]                      # 8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 9
  - [[-1, 2], 1, Concat, [1]]                        # 10 cat backbone P3 (layer 2)
  - [-1, 2, C3k2, [128, False]]                      # 11 (P3/8-small)  <- Detect input

  - [-1, 1, Conv, [128, 3, 2]]                       # 12
  - [[-1, 8], 1, Concat, [1]]                        # 13 cat head P4 (layer 8)
  - [-1, 2, C3k2, [256, False]]                      # 14 (P4/16-medium) <- Detect input

  - [-1, 1, Conv, [256, 3, 2]]                       # 15
  - [[-1, 5], 1, Concat, [1]]                        # 16 cat backbone P5 (layer 5, SPPF out)
  - [-1, 2, C3k2, [512, True]]                       # 17 (P5/32-large)  <- Detect input

  - [[11, 14, 17], 1, Detect, [nc]]                  # 18 Detect(P3, P4, P5)
